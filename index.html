<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230a0a0a'/><g stroke='%23ff6b35' stroke-width='14' stroke-linecap='round' fill='none'><line x1='30' y1='90' x2='150' y2='90'/><line x1='40' y1='65' x2='40' y2='115'/><line x1='140' y1='65' x2='140' y2='115'/><line x1='55' y1='75' x2='55' y2='105'/><line x1='125' y1='75' x2='125' y2='105'/></g></svg>">
<title>Recomp Tracker</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar" id="topbar"></header>
<main id="app"></main>

<nav class="tabs">
  <button data-view="today" class="active">
    <span class="icon">●</span><span>Today</span>
  </button>
  <button data-view="nutrition">
    <span class="icon">◍</span><span>Food</span>
  </button>
  <button data-view="predictor">
    <span class="icon">↘</span><span>Predict</span>
  </button>
  <button data-view="stats">
    <span class="icon">▲</span><span>Stats</span>
  </button>
  <button data-view="calendar">
    <span class="icon">▦</span><span>Calendar</span>
  </button>
  <button data-view="settings">
    <span class="icon">⚙</span><span>Settings</span>
  </button>
</nav>

<div id="builder-root"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<div id="print-root" class="print-root"></div>


<!-- Classic scripts, loaded in dependency order. NOT type="module":
     the codebase shares one global scope and modules would isolate it.
     boot.js must stay last - it calls render() once everything exists. -->
<script src="app.js"></script>
<script src="builder.js"></script>
<script src="hiit.js"></script>
<script src="boot.js"></script>
</body>
</html>
